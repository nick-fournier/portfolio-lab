name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels an older run still in progress, so an older build can never
# finish last and overwrite :latest (two merges 21 s apart did, 2026-10-08).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint, format, docstrings, file length
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: uv run pytest

  image:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native arm64 runner (orange is arm64); free for public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio-lab:latest
            ${{ secrets.DOCKER_USERNAME }}/portfolio-lab:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
