[project]
name = "portfolio-lab"
version = "0.1.0"
description = "Research lab for portfolio strategies: point-in-time data, walk-forward backtests, and a dashboard."
readme = "README.md"
authors = [{ name = "nick-fournier", email = "nichfournier@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pydantic-settings>=2.5",
    "pyportfolioopt>=1.5.6",
    "statsmodels>=0.14.4",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
plab = "portfolio_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # pep8-naming
    "RUF",     # ruff-specific
    "PL",      # pylint
    "D",       # pydocstyle (docstrings required)
]
ignore = [
    "D105",     # magic methods (__repr__ etc.) are self-describing
    "D107",     # __init__ is documented in the class docstring
    "PLR2004",  # numeric thresholds (e.g. $5 price floor) are domain constants, named where reused
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8  # config-heavy constructors (backtest runs, cost models) legitimately take several args

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913"]  # test functions and fixtures don't need docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warning about its own httpx dependency; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
