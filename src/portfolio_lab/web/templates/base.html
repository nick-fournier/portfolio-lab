<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css').path }}">
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
  <script>
    // Shared Plotly options: no toolbar on small touch screens, where it covers the chart.
    window.PLOT_CONFIG = {
      responsive: true,
      displaylogo: false,
      displayModeBar: window.matchMedia("(max-width: 600px)").matches ? false : "hover",
    };
    // Touch screens never "leave" a chart, so a tapped hover label would stay up. There,
    // labels show only the tapped point, vanish after a few seconds, and clear when the
    // page is touched anywhere outside the chart.
    const TOUCH = window.matchMedia("(hover: none)").matches;
    const HOVER_MS = 3000;
    window.drawPlot = (id, fig) => {
      if (TOUCH) fig.layout.hovermode = "closest";
      Plotly.newPlot(id, fig.data, fig.layout, window.PLOT_CONFIG).then((el) => {
        if (fig.layout.xaxis && fig.layout.xaxis.rangeselector) rebaseOnZoom(el);
      });
    };
    // Growth charts with zoom buttons: on any zoom, every line is rescaled to $1 at the left
    // edge of the window and the y-axis fits the visible part, so a 1-year view isn't flat.
    // "Max" (autorange) restores the original curves.
    const rebaseOnZoom = (el) => {
      const original = el.data.map((t) => t.y.slice());
      el.on("plotly_relayout", (ev) => {
        const reset = ev["xaxis.autorange"];
        const range = ev["xaxis.range"] || [ev["xaxis.range[0]"], ev["xaxis.range[1]"]];
        if (!reset && range[0] === undefined) return;  // not an x zoom (e.g. our own y update)
        const from = reset ? "" : String(range[0]).slice(0, 10);
        const end = reset ? "9999" : String(range[1]).slice(0, 10);
        let lo = Infinity, hi = -Infinity;
        const ys = el.data.map((t, i) => {
          const k = reset ? -1 : t.x.findIndex((x) => x >= from);
          const base = k < 0 ? 1 : original[i][k];
          const y = original[i].map((v) => v / base);
          if (t.visible === true) {
            t.x.forEach((x, j) => {
              if (x >= from && x <= end) { lo = Math.min(lo, y[j]); hi = Math.max(hi, y[j]); }
            });
          }
          return y;
        });
        Plotly.restyle(el, {y: ys});
        if (lo < hi) {
          const log = el.layout.yaxis.type === "log";
          const pad = (v, f) => (log ? Math.log10(v * f) : v * f);
          Plotly.relayout(el, {"yaxis.range": [pad(lo, 0.97), pad(hi, 1.03)]});
        }
      });
    };
    if (TOUCH) {
      // Plotly fires no hover event for taps, so time the label from the touch itself.
      const timers = new Map();
      document.addEventListener("touchstart", (event) => {
        for (const el of document.querySelectorAll(".js-plotly-plot")) {
          clearTimeout(timers.get(el));
          if (el.contains(event.target)) {
            timers.set(el, setTimeout(() => Plotly.Fx.unhover(el), HOVER_MS));
          } else {
            Plotly.Fx.unhover(el);
          }
        }
      }, {passive: true});
    }
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="/">Portfolio lab</a>
    <nav><a href="/">Overview</a><a href="/runs">Runs</a><a href="/signals">Signals</a><a href="/context">Context</a><a href="/forecasts">Forecasts</a><a href="/compare">Compare</a><a href="/taxes">Taxes</a><a href="/paper">Paper</a><a href="/status">Data status</a><a href="/how-it-works">How it works</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
